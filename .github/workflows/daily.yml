name: daily-paper-trade

on:
  schedule:
    - cron: "0 14 * * 1-5"    # UTC 14:00 = 台灣時間 22:00（週一到週五）；證交所法人資料約 16:30 後公布
  workflow_dispatch:
    inputs:
      selftest:
        description: "只檢查資料來源通不通（不改任何紀錄）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (模擬資料，不連網路)
        run: |
          python tests/test_engine.py
          python tests/test_run_daily.py

      - name: Data source self-test
        if: ${{ inputs.selftest }}
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python run_daily.py --selftest

      - name: Daily update
        if: ${{ !inputs.selftest }}
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python run_daily.py

      - name: Commit results
        if: ${{ !inputs.selftest }}
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add state data docs
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "daily update $(date -u +%F)"
            git push
          fi
